name: whoami
on:
  workflow_dispatch:

jobs:
  who:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install telethon

      # Print the identity behind TELEGRAM_SESSION so the user can confirm it is
      # the account that owns the target channel, and try a public @username.
      - name: Account identity + username lookup
        run: |
          cat > /tmp/probe.py <<'PY'
          import asyncio, os
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          async def go():
              c = TelegramClient(StringSession(os.environ["TELEGRAM_SESSION"]),
                                 int(os.environ["TELETHON_API_ID"]),
                                 os.environ["TELETHON_API_HASH"])
              await c.connect()
              me = await c.get_me()
              print(f"account id  : {me.id}")
              print(f"first name : {me.first_name}")
              print(f"last name  : {me.last_name or '-'}")
              print(f"username   : {me.username or '-'}")
              print(f"phone      : {me.phone or '-'}")
              print(f"is bot     : {me.bot}")

              # Is this the account that forwards? A user session sends as the user.
              print(f"input peer : {(await c.get_input_entity(me)).__class__.__name__}")

              user_handle = (os.environ.get("TARGET_USERNAME") or "").strip()
              if user_handle:
                  handle = user_handle.lstrip("@")
                  try:
                      ent = await c.get_entity(handle)
                      print(f"\nusername @{handle} -> {ent.title!r} "
                            f"id={ent.id} megagroup={getattr(ent,'megagroup',None)} "
                            f"broadcast={getattr(ent,'broadcast',None)}")
                      # Check whether we may post there.
                      try:
                          perms = await c.get_permissions(ent, 'me')
                          print(f"  our rights: {sorted(perms) if isinstance(perms, dict) else perms}")
                      except Exception as ex:
                          print(f"  permissions: {type(ex).__name__}: {ex}")
                      try:
                          msgs = await c.get_messages(ent, limit=2)
                          print(f"  read {len(msgs)} message(s): "
                                f"{[m.id for m in msgs]}")
                      except Exception as ex:
                          print(f"  read FAILED: {type(ex).__name__}: {ex}")
                  except Exception as ex:
                      print(f"\nusername @{handle} FAILED: {type(ex).__name__}: {ex}")
              else:
                  print("\nno TARGET_USERNAME given")
              await c.disconnect()

          asyncio.run(go())
          PY
          python /tmp/probe.py
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELETHON_API_ID: ${{ secrets.TELETHON_API_ID }}
          TELETHON_API_HASH: ${{ secrets.TELETHON_API_HASH }}
          TARGET_USERNAME: ${{ vars.TARGET_USERNAME }}