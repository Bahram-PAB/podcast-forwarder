name: send-test
on:
  workflow_dispatch:
# One Telegram session = one auth key = one IP. GitHub runners get random IPs,
# so two overlapping runs would burn the session with AuthKeyDuplicatedError.
concurrency:
  group: telegram-session
  cancel-in-progress: false


jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install telethon
      - name: Offline tests first — the probe imports the same module
        run: PYTHONPATH="$PWD" python test_bot.py

      # Uses bot.py's own resolve_target so the send path tested here is exactly
      # the one the cron workflow runs — a raw -100 id does not resolve on a cold
      # StringSession client, which is what this test originally tripped over.
      - name: Send one long file to the target
        run: |
          cat > /tmp/probe.py <<'PY'
          import asyncio, os
          from pathlib import Path
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          from bot import audio_duration, format_caption, load_channels, long_media, resolve_target

          MIN = 900

          async def go():
              c = TelegramClient(StringSession(os.environ["TELEGRAM_SESSION"]),
                                 int(os.environ["TELETHON_API_ID"]),
                                 os.environ["TELETHON_API_HASH"])
              await c.connect()
              target = await resolve_target(c, os.environ["TARGET_CHAT_ID"])
              print(f"target ready: {target.title!r}")
              for handle, name in load_channels():
                  e = await c.get_entity(handle)
                  hit = next((m for m in await c.get_messages(e, limit=200)
                              if audio_duration(m) >= MIN), None)
                  if hit:
                      sent = await c.send_file(
                          target, hit.media,
                          caption=format_caption(name, audio_duration(hit)))
                      print(f"candidate: {name} id={hit.id} {audio_duration(hit)}s")
                      print(f"SENT OK -> message {sent.id}")
                      await c.disconnect()
                      return
                  print(f"no long file in {name}")
              print("nothing over threshold to test with")
              await c.disconnect()

          asyncio.run(go())
          PY
          PYTHONPATH="$PWD" python /tmp/probe.py
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELETHON_API_ID: ${{ secrets.TELETHON_API_ID }}
          TELETHON_API_HASH: ${{ secrets.TELETHON_API_HASH }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
