name: forward
on:
  schedule:
    - cron: '0 */8 * * *'   # every 8h, so the repo runs under observation for days
  workflow_dispatch:
# One Telegram session = one auth key = one IP. GitHub runners get random IPs,
# so two overlapping runs would burn the session with AuthKeyDuplicatedError.
concurrency:
  group: telegram-session
  cancel-in-progress: false


jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install telethon

      - name: Run forwarder
        run: python bot.py
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELETHON_API_ID: ${{ secrets.TELETHON_API_ID }}
          TELETHON_API_HASH: ${{ secrets.TELETHON_API_HASH }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}

      - name: Commit state
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          if git diff --staged --quiet; then
            echo 'state unchanged'
          else
            git commit -m 'state: advance per-channel cursors'
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
