name: forward
# No schedule: an external trigger fires this (GitHub cron drifted ~5h and
# reported failed runs green). workflow_dispatch stays for manual runs.
on:
  workflow_dispatch:
# One Telegram session = one auth key = one IP. GitHub runners get random IPs,
# so two overlapping runs would burn the session with AuthKeyDuplicatedError.
concurrency:
  group: telegram-session
  cancel-in-progress: false


jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install telethon

      - name: Run forwarder
        run: python bot.py
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELETHON_API_ID: ${{ secrets.TELETHON_API_ID }}
          TELETHON_API_HASH: ${{ secrets.TELETHON_API_HASH }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}

      - name: Commit state
        # always(): bot.py now exits 1 on any failed channel, and skipping this
        # step would throw away the cursor advances of the channels that did work.
        if: always()
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          if git diff --staged --quiet; then
            echo 'state unchanged'
          else
            git commit -m 'state: advance per-channel cursors'
            # GitHub 500s on push now and then; a lost push loses the cursors
            # and the whole next window looks brand new. Retry over anything
            # that landed meanwhile.
            for i in 1 2 3; do
              git pull --rebase origin main &&
              git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main && exit 0
              sleep 15
            done
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
