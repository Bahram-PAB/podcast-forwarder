name: forward
on:
  schedule:
    # هر ۳۰ دقیقه. این فقط تعیین‌کنندهٔ تأخیر است: state.json جلوی تکرار را
    # می‌گیرد و از دست رفتن پیام رخ نمی‌دهد، پس بازه را می‌توان درشت گرفت.
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install telethon requests

      - name: Run forwarder
        run: python bot.py
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELETHON_API_ID: ${{ secrets.TELETHON_API_ID }}
          TELETHON_API_HASH: ${{ secrets.TELETHON_API_HASH }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}

      - name: Commit state
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          if git diff --staged --quiet; then
            echo 'state unchanged'
          else
            git commit -m 'state: advance per-channel cursors'
            git push
          fi