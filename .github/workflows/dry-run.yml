name: dry-run
on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install telethon

      # A temp chat with just the account itself — never sends media, never needs
      # a real group. Proves the read path + duration filter end to end.
      - name: Read + filter (no send)
        run: |
          import asyncio, os
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          from telethon.tl.types import DocumentAttributeAudio
          from pathlib import Path

          MIN = 900

          def duration(m):
              d = getattr(m, "audio", None) or getattr(m, "voice", None)
              if d is None:
                  return 0
              for a in getattr(d, "attributes", None) or []:
                  if isinstance(a, DocumentAttributeAudio):
                      return a.duration or 0
              return 0

          async def go():
              c = TelegramClient(StringSession(os.environ["TELEGRAM_SESSION"]),
                                 int(os.environ["TELETHON_API_ID"]),
                                 os.environ["TELETHON_API_HASH"])
              await c.connect()
              assert await c.is_user_authorized(), "session not authorized"
              print("authorized:", await c.is_user_authorized())
              me = await c.get_me()
              print("account:", me.id, me.first_name)
              print("dial, ok")
              for line in Path("channels.txt").read_text(encoding="utf-8").splitlines():
                  if not line.strip() or line.lstrip().startswith("#"):
                      continue
                  h, _, name = line.partition("|")
                  h = h.strip().lstrip("@")
                  name = name.strip() or h
                  try:
                      e = await c.get_entity(h)
                      msgs = await c.get_messages(e, limit=30)
                      long_ones = [m for m in msgs if duration(m) >= MIN]
                      print(f"{name}: newest={msgs[0].id if msgs else None} "
                            f"read={len(msgs)} long={len(long_ones)} "
                            f"durs={[duration(m)//60 for m in msgs if duration(m)]}")
                  except Exception as ex:
                      print(f"{name}: ERR {type(ex).__name__}: {ex}")
              await c.disconnect()

          asyncio.run(go())
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELETHON_API_ID: ${{ secrets.TELETHON_API_ID }}
          TELETHON_API_HASH: ${{ secrets.TELETHON_API_HASH }}

      - name: Offline tests
        run: python test_bot.py