name: smoke
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install telethon
      - name: Unit tests
        run: python test_bot.py
      - name: Session + channel + duration check
        run: |
          python - <<'PY'
          import asyncio, os
          from bot import audio_duration, long_media
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          async def main():
              c = TelegramClient(
                  StringSession(os.environ["TELEGRAM_SESSION"]),
                  int(os.environ["TELETHON_API_ID"]), os.environ["TELETHON_API_HASH"])
              await c.connect()
              print("authorized:", await c.is_user_authorized())
              me = await c.get_me()
              print("account:", me.id, me.first_name)
              for h in ["ahangify","gooshvaaareh","remixjavan_com","Azerbaijan20","melody9","savadnameh"]:
                  try:
                      m = await c.get_messages(h, limit=5)
                      print(f"{h}: {len(m)} msg, newest id={m[0].id if m else None}")
                      for x in m:
                          d = audio_duration(x)
                          hit = long_media(x)
                          if d:
                              print(f"   -> media {d//60}:{d%60:02d} id={x.id} forward={hit is not None}")
                  except Exception as e:
                      print(f"{h}: ERR {type(e).__name__}: {e}")
              await c.disconnect()
          asyncio.run(main())
          PY
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELETHON_API_ID: ${{ secrets.TELETHON_API_ID }}
          TELETHON_API_HASH: ${{ secrets.TELETHON_API_HASH }}