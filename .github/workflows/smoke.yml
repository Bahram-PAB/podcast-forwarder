name: smoke
on:
  workflow_dispatch:
# One Telegram session = one auth key = one IP. GitHub runners get random IPs,
# so two overlapping runs would burn the session with AuthKeyDuplicatedError.
concurrency:
  group: telegram-session
  cancel-in-progress: false


jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install telethon
      - name: Unit tests
        run: python test_bot.py
      - name: Duration survey — what actually arrives in these channels
        run: |
          python - <<'PY'
          import asyncio, os
          from bot import audio_duration
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          CH = ["ahangify","gooshvaaareh","remixjavan_com","Azerbaijan20","melody9","savadnameh"]

          async def main():
              c = TelegramClient(StringSession(os.environ["TELEGRAM_SESSION"]),
                  int(os.environ["TELETHON_API_ID"]), os.environ["TELETHON_API_HASH"])
              await c.connect()
              print("authorized:", await c.is_user_authorized())
              for h in CH:
                  try:
                      m = await c.get_messages(h, limit=200)
                      ds = sorted(d for d in (audio_duration(x) for x in m) if d)
                      over = [d for d in ds if d >= 900]
                      print(f"{h}: scanned={len(m)} audio={len(ds)} "
                            f"max={(max(ds)//60)}m{(max(ds)%60):02d} over15={len(over)} "
                            f"top5={[f'{d//60}:{d%60:02d}' for d in ds[-5:]]}")
                  except Exception as e:
                      print(f"{h}: ERR {type(e).__name__}: {e}")
              await c.disconnect()
          asyncio.run(main())
          PY
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELETHON_API_ID: ${{ secrets.TELETHON_API_ID }}
          TELETHON_API_HASH: ${{ secrets.TELETHON_API_HASH }}
