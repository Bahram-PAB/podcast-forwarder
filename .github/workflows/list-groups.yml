name: list-groups
on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install telethon

      - name: Find the target chat
        run: |
          cat > /tmp/probe.py <<'PY'
          import asyncio, os
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          from telethon.tl.types import Channel, Chat

          async def go():
              c = TelegramClient(StringSession(os.environ["TELEGRAM_SESSION"]),
                                 int(os.environ["TELETHON_API_ID"]),
                                 os.environ["TELETHON_API_HASH"])
              await c.connect()
              raw = (os.environ.get("TARGET_CHAT_ID") or "").strip()
              print(f"configured TARGET_CHAT_ID shape: len={len(raw)} "
                    f"numeric={raw.lstrip('-').isdigit()}")

              rows = []
              async for d in c.iter_dialogs():
                  e = d.entity
                  if isinstance(e, Chat):
                      rows.append((f"-{e.id}", e.title, "basic group", d))
                  elif isinstance(e, Channel) and e.megagroup:
                      rows.append((f"-100{e.id}", e.title, "supergroup", d))

              print(f"\ntotal groups/channels in dialogs: {len(rows)}")

              # The user just sent /start in the target group, so the newest
              # active group is almost certainly it.
              def newest(r):
                  return r[3].date or 0
              recent = sorted(rows, key=newest, reverse=True)[:8]
              print("\n8 most recently active groups:")
              for gid, title, kind, d in recent:
                  print(f"  {gid:>16}  {title!r}  [{kind}]  last={d.date}")

              match = [r for r in rows if r[0] == raw]
              if match:
                  gid, title, kind, _ = match[0]
                  print(f"\nMATCH: configured id == {title!r} [{kind}]")
                  try:
                      inp = await c.get_input_entity(match[0][3].entity)
                      print(f"  resolves: {inp.__class__.__name__}")
                  except Exception as ex:
                      print(f"  resolve FAILED: {type(ex).__name__}: {ex}")
              else:
                  print(f"\nconfigured id {raw} is NOT in the dialogs list")

              # Show the bare channel id too, in case of a -100 mismatch.
              if raw.lstrip("-").isdigit():
                  bare = raw.lstrip("-")
                  for gid, title, kind, d in rows:
                      if gid.lstrip("-100").lstrip("-") == bare:
                          print(f"  same bare id, other form: {gid} {title!r} [{kind}]")
              await c.disconnect()

          asyncio.run(go())
          PY
          python /tmp/probe.py
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELETHON_API_ID: ${{ secrets.TELETHON_API_ID }}
          TELETHON_API_HASH: ${{ secrets.TELETHON_API_HASH }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}