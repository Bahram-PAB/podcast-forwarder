name: list-groups
on:
  workflow_dispatch:
# One Telegram session = one auth key = one IP. GitHub runners get random IPs,
# so two overlapping runs would burn the session with AuthKeyDuplicatedError.
concurrency:
  group: telegram-session
  cancel-in-progress: false


jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install telethon

      # A StringSession carries only the auth key — no entity cache. So a chat
      # the account belongs to can still fail get_input_entity(id) on a cold
      # client. Scanning dialogs forces the cache to fill, then the id resolves.
      - name: Scan dialogs then resolve target
        run: |
          cat > /tmp/probe.py <<'PY'
          import asyncio, os
          from telethon import TelegramClient, utils
          from telethon.sessions import StringSession
          from telethon.tl.types import Channel, Chat, PeerChannel

          async def go():
              c = TelegramClient(StringSession(os.environ["TELEGRAM_SESSION"]),
                                 int(os.environ["TELETHON_API_ID"]),
                                 os.environ["TELETHON_API_HASH"])
              await c.connect()
              raw = (os.environ.get("TARGET_CHAT_ID") or "").strip()

              before = None
              try:
                  await c.get_input_entity(raw)
                  before = "resolved"
              except Exception as ex:
                  before = f"{type(ex).__name__}"
              print(f"before dialog scan: {before}")

              found = None
              total = 0
              async for d in c.iter_dialogs():
                  e = d.entity
                  if isinstance(e, Chat):
                      pid = -e.id
                  elif isinstance(e, Channel):
                      # Broadcast channels are legit targets too — the earlier
                      # probe filtered megagroup-only and silently dropped them.
                      pid = utils.get_peer_id(PeerChannel(e.id))
                  else:
                      continue
                  total += 1
                  if str(pid) == raw or str(e.id) == raw.lstrip("-").lstrip("100"):
                      found = e
              print(f"scanned {total} groups")

              if found is None:
                  print(f"VERDICT: {raw} not among dialogs -> wrong id or not a member")
                  await c.disconnect()
                  return

              print(f"VERDICT: found {found.title!r} "
                    f"(id={found.id}, megagroup={getattr(found, 'megagroup', None)}, "
                    f"broadcast={getattr(found, 'broadcast', None)})")

              # Now that the cache is warm, retry the plain id.
              try:
                  inp = await c.get_input_entity(raw)
                  print(f"after scan, raw id resolves: {inp.__class__.__name__}")
              except Exception as ex:
                  print(f"after scan, raw id still fails: {type(ex).__name__}: {ex}")
                  try:
                      inp = await c.get_input_entity(found)
                      print(f"  but the ENTITY OBJECT resolves: {inp.__class__.__name__}")
                      print("  -> bot.py must pass the entity, not the raw id")
                  except Exception as ex2:
                      print(f"  entity object also fails: {type(ex2).__name__}: {ex2}")

              msgs = await c.get_messages(found, limit=5)
              print(f"read {len(msgs)} message(s)")
              for m in msgs:
                  print(f"  id={m.id} date={m.date} text={(m.text or '')[:50]!r}")
              await c.disconnect()

          asyncio.run(go())
          PY
          python /tmp/probe.py
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELETHON_API_ID: ${{ secrets.TELETHON_API_ID }}
          TELETHON_API_HASH: ${{ secrets.TELETHON_API_HASH }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
