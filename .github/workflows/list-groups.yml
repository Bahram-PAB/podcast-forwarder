name: list-groups
on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install telethon

      - name: Diagnose the target chat
        run: |
          cat > /tmp/probe.py <<'PY'
          import asyncio, os
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          from telethon.tl.types import Channel, Chat

          async def go():
              c = TelegramClient(StringSession(os.environ["TELEGRAM_SESSION"]),
                                 int(os.environ["TELETHON_API_ID"]),
                                 os.environ["TELETHON_API_HASH"])
              await c.connect()
              raw = int((os.environ.get("TARGET_CHAT_ID") or "0").strip())

              found = None
              total = 0
              async for d in c.iter_dialogs():
                  e = d.entity
                  pid = None
                  if isinstance(e, Chat):
                      pid = -e.id
                  elif isinstance(e, Channel):
                      pid = -1000000000000 - e.id if e.megagroup else None
                  if pid is None:
                      continue
                  total += 1
                  if pid == raw:
                      found = e
                  # Also match the bare channel id, in case the user gave the
                  # -100 form for what is actually a basic group.
                  if isinstance(e, Channel) and e.id == abs(raw):
                      found = e

              print(f"scanned dialogs, {total} groups/channels")
              if found is None:
                  print(f"VERDICT: account is NOT a member of {raw}")
                  print("        either the id is wrong or the account has not joined")
              else:
                  print(f"VERDICT: member of -> {found.title!r} "
                        f"(id={found.id}, megagroup={getattr(found,'megagroup',None)})")
                  try:
                      inp = await c.get_input_entity(found)
                      print(f"        resolves via entity object: {inp.__class__.__name__}")
                  except Exception as ex:
                      print(f"        resolve FAILED: {type(ex).__name__}: {ex}")
              await c.disconnect()

          asyncio.run(go())
          PY
          python /tmp/probe.py
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELETHON_API_ID: ${{ secrets.TELETHON_API_ID }}
          TELETHON_API_HASH: ${{ secrets.TELETHON_API_HASH }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}