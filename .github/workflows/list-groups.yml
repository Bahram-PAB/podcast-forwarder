name: list-groups
on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install telethon

      - name: Direct membership query
        run: |
          cat > /tmp/probe.py <<'PY'
          import asyncio, os
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          async def go():
              c = TelegramClient(StringSession(os.environ["TELEGRAM_SESSION"]),
                                 int(os.environ["TELETHON_API_ID"]),
                                 os.environ["TELETHON_API_HASH"])
              await c.connect()
              raw = (os.environ.get("TARGET_CHAT_ID") or "").strip()
              try:
                  inp = await c.get_input_entity(raw)
                  print(f"get_input_entity OK -> {inp.__class__.__name__}")
                  # Now try to actually read a message from it.
                  msgs = await c.get_messages(inp, limit=3)
                  print(f"read {len(msgs)} message(s) from target")
                  for m in msgs:
                      print(f"  id={m.id} date={m.date} text={m.text[:40]!r}")
              except Exception as ex:
                  print(f"FAIL: {type(ex).__name__}: {ex}")
                  print("  -> this account cannot see that chat at all")
              await c.disconnect()

          asyncio.run(go())
          PY
          python /tmp/probe.py
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELETHON_API_ID: ${{ secrets.TELETHON_API_ID }}
          TELETHON_API_HASH: ${{ secrets.TELETHON_API_HASH }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}