name: list-groups
on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install telethon

      - name: List group chats and test the configured target
        run: |
          cat > /tmp/probe.py <<'PY'
          import asyncio, os
          from telethon import TelegramClient
          from telethon.sessions import StringSession
          from telethon.tl.types import Channel, Chat

          async def go():
              c = TelegramClient(StringSession(os.environ["TELEGRAM_SESSION"]),
                                 int(os.environ["TELETHON_API_ID"]),
                                 os.environ["TELETHON_API_HASH"])
              await c.connect()
              if not await c.is_user_authorized():
                  print("session not authorized")
                  return

              target = (os.environ.get("TARGET_CHAT_ID") or "").strip()
              # Report only the shape — never the value itself.
              print(f"TARGET_CHAT_ID len={len(target)} "
                    f"numeric={target.lstrip('-').isdigit()} "
                    f"starts_with_at={target.startswith('@')} "
                    f"is_invite_link={'t.me/+' in target or 'joinchat' in target}")

              groups = []
              async for d in c.iter_dialogs():
                  ent = d.entity
                  if isinstance(ent, Chat):
                      groups.append((f"-{ent.id}", d.name, "basic group"))
                  elif isinstance(ent, Channel) and ent.megagroup:
                      groups.append((f"-100{ent.id}", d.name, "supergroup"))

              print(f"\n{len(groups)} group(s) visible to the account:")
              for gid, title, kind in groups:
                  print(f"  {gid}  {title}  [{kind}]")

              if target:
                  try:
                      e = await c.get_input_entity(target)
                      print(f"\nTARGET_CHAT_ID resolves -> {e.__class__.__name__}")
                  except Exception as ex:
                      print(f"\nTARGET_CHAT_ID does NOT resolve: {type(ex).__name__}: {ex}")
              await c.disconnect()

          asyncio.run(go())
          PY
          python /tmp/probe.py
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELETHON_API_ID: ${{ secrets.TELETHON_API_ID }}
          TELETHON_API_HASH: ${{ secrets.TELETHON_API_HASH }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}